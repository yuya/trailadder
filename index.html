<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>trailadder</title>
<meta name="description" content="公開から1か月以内の映画と、2か月先までの公開予定作の予告編を、公開日順にスワイプで観る。">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta property="og:type" content="website">
<meta property="og:site_name" content="trailadder">
<meta property="og:title" content="trailadder">
<meta property="og:description" content="公開から1か月以内の映画と、2か月先までの公開予定作の予告編を、公開日順にスワイプで観る。">
<meta property="og:url" content="/">
<meta property="og:image" content="/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="trailadder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700;800&family=IBM+Plex+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 映像が全面。左下に公開日を大きく置き、最下段は電球の公開カレンダー（点灯＝公開済み、今日で灯りが止まる）。
     映像以外の面はすべて劇場の緞帳。 */
  --curtain:#4b0f1e;        /* 緞帳の臙脂 */
  --curtain-deep:#2a0710;   /* 緞帳の影 */
  --light:#fff5dc;          /* 映写機の光 */
  --bulb:#ffc93a;           /* 点灯した電球 */
  --silver:#b9bdc9;         /* 消灯した電球、銀幕 */
  /* 欧文は Jost、和文は IBM Plex Sans JP */
  --display:"Jost","IBM Plex Sans JP",system-ui,sans-serif;
  --ui:"Jost","IBM Plex Sans JP",system-ui,sans-serif;
}
.date{letter-spacing:-.03em}
.title,.ihead h3{font-weight:700}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000}
/* 和文の字間を詰める（palt）を全体にかける。cinemaladder と同じ。和文と英数字のあいだはブラウザが細く空ける */
body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;font-family:var(--ui);color:var(--light);color-scheme:dark;font-feature-settings:"palt" 1;text-autospace:normal;
  -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;font-feature-settings:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.curtain{background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 7px,rgba(0,0,0,0) 7px 24px,rgba(255,235,200,.05) 24px 33px,rgba(0,0,0,0) 33px 48px),
  linear-gradient(180deg,#5c1426,var(--curtain) 42%,var(--curtain-deep))}

/* ---------- stage: always landscape ---------- */
#stage{position:absolute;top:0;left:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden;background:#000;
  --W:100vw;--H:100vh;--railh:62px;--mid:42%;
  --il:env(safe-area-inset-left,0px);--ir:env(safe-area-inset-right,0px);--it:env(safe-area-inset-top,0px);--ib:env(safe-area-inset-bottom,0px);
  --gl:max(18px,var(--il));--gr:max(18px,var(--ir));--gt:max(8px,var(--it));--gb:max(10px,var(--ib))}
#stage.cw{--il:env(safe-area-inset-top,0px);--ir:env(safe-area-inset-bottom,0px);--it:env(safe-area-inset-right,0px);--ib:env(safe-area-inset-left,0px)}
#stage.ccw{--il:env(safe-area-inset-bottom,0px);--ir:env(safe-area-inset-top,0px);--it:env(safe-area-inset-left,0px);--ib:env(safe-area-inset-right,0px)}

#player,#track{position:absolute;inset:0;will-change:transform}
#player{z-index:0;background:#000;overflow:hidden}
#ambient{position:absolute;inset:-12%;background:center/cover no-repeat;filter:blur(32px) brightness(.42) saturate(1.25)}
#ytbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000}
#ytbox iframe,#yt{display:block;width:100%;height:100%;border:0}

#track{z-index:1;pointer-events:none}
.slide{position:absolute;inset:0;overflow:hidden}
.slide[data-role="prev"]{transform:translateX(-100%)}
.slide[data-role="next"]{transform:translateX(100%)}
.slide .ambw,.slide .ov{display:none}
.slide .bg{position:absolute;inset:0;background:#000 center/cover no-repeat;transition:opacity .35s}
.slide.live .bg{opacity:0}
.slide .scrim{position:absolute;inset:0;background:
  linear-gradient(to top,rgba(0,0,0,.86),rgba(0,0,0,.42) 36%,rgba(0,0,0,0) 62%),
  linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,0) 24%)}
.meta{position:absolute;left:var(--gl);bottom:calc(var(--railh) + var(--gb) + 12px);max-width:min(62%,680px);display:flex;flex-direction:column;gap:6px}
.when{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;max-width:calc(var(--W) * .5 - 56px - var(--gl))}
.date{font:800 clamp(34px,calc(var(--H) * .135),72px)/.95 var(--display);letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.dow{flex:none;width:1.75em;height:1.75em;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px currentColor;font:800 clamp(13px,calc(var(--H) * .042),20px)/1 var(--display)}
.state{flex:none;font:700 12.5px/1 var(--ui);padding:7px 12px;border-radius:99px;white-space:nowrap}
.state.lit{background:var(--bulb);color:var(--curtain-deep)}
.state.unlit{box-shadow:inset 0 0 0 1.5px var(--silver);background:rgba(0,0,0,.3)}
.title{margin:0;font:800 clamp(20px,calc(var(--H) * .074),40px)/1.25 var(--display);text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;text-shadow:0 1px 14px rgba(0,0,0,.65);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.sub{margin:0;font:500 12.5px/1.5 var(--ui);opacity:.86;text-shadow:0 1px 6px rgba(0,0,0,.7)}

#gest{position:absolute;inset:0;z-index:2;touch-action:none}
#stage.direct #gest{pointer-events:none}

#progress{position:absolute;z-index:3;left:0;right:0;bottom:0;height:3px;background:rgba(255,245,220,.16);pointer-events:none}
#progress i{display:block;height:100%;width:0;background:var(--bulb)}
#stage.buffering #progress i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

/* everything marked .h fades with the HUD */
.h{transition:opacity .22s}
#stage:not(.hud) .h{opacity:0;pointer-events:none}

#top{position:absolute;z-index:4;top:0;left:0;right:0;height:calc(46px + var(--gt));padding:var(--gt) calc(var(--gr) - 8px) 0 var(--gl);display:flex;align-items:center;gap:14px}
.brand{flex:none;display:inline-flex;align-items:center;gap:7px;font:800 18px/1 var(--display);letter-spacing:.02em}
.brand .mark{width:22px;height:22px;flex:none}
.lad{color:var(--bulb)}
.chips{display:flex;gap:6px;min-width:0}
.chip{flex:none;height:30px;padding:0 12px;border-radius:99px;font:700 12px/1 var(--ui);background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(255,245,220,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip small{font:500 11px/1 var(--ui);opacity:.7;margin-left:.45em;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--light);color:var(--curtain-deep);box-shadow:none}
.tools{margin-left:auto;flex:none;display:flex;align-items:center;gap:2px}
.ib{flex:none;width:42px;height:42px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:rgba(255,245,220,.16)}
#bSound span{display:none;font:700 12.5px/1 var(--ui);white-space:nowrap}
#stage.muted #bSound{width:auto;padding:0 14px 0 10px;background:var(--bulb);color:var(--curtain-deep);margin-right:4px;height:34px}
#stage.muted #bSound span{display:inline}
#stage.muted #bSound svg{width:20px;height:20px}
#stage.muted #bSound .on,#stage:not(.muted) #bSound .off{display:none}
#stage.fill #bFill .out,#stage:not(.fill) #bFill .in{display:none}
#stage.tall #bFill{display:none}
#stage.narrow .chip small{display:none}
#stage.narrow .chip{padding:0 10px}
#stage.narrow.muted #bSound span{display:none}
#stage.narrow.muted #bSound{width:38px;padding:0}

#hint{display:none;position:absolute;z-index:4;left:50%;top:var(--mid);transform:translate(-50%,-50%);margin:0;pointer-events:none;white-space:nowrap;
  font:700 13px/1 var(--ui);background:rgba(0,0,0,.62);padding:10px 16px;border-radius:99px}
#stage.stalled:not(.blocked):not(.direct) #hint{display:block}
/* until the trailer is actually playing: three marquee bulbs light in turn over the still */
#loader{display:none;position:absolute;z-index:3;left:50%;top:var(--mid);transform:translate(-50%,-50%);gap:11px;padding:13px 17px;border-radius:99px;pointer-events:none;
  background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#loader i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--silver);animation:chase 1.05s infinite}
#loader i:nth-child(2){animation-delay:.175s}
#loader i:nth-child(3){animation-delay:.35s}
@keyframes chase{0%,55%,100%{background:transparent;box-shadow:inset 0 0 0 1.5px var(--silver)}12%,30%{background:var(--bulb);box-shadow:0 0 10px rgba(255,201,58,.85)}}
#stage.loading:not(.stalled):not(.blocked):not(.direct) #loader{display:flex}
#blockmsg{display:none;position:absolute;z-index:4;left:50%;top:var(--mid);transform:translate(-50%,-50%);text-align:center;font:700 13px/1.7 var(--ui);background:rgba(0,0,0,.6);padding:12px 18px;border-radius:14px;max-width:70%}
#stage.blocked #blockmsg{display:block}
#blockmsg a{display:inline-block;margin-top:6px;color:var(--bulb)}

.edge{position:absolute;z-index:4;top:var(--mid);width:44px;height:64px;margin-top:-32px;display:grid;place-items:center;border-radius:12px}
.edge svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 4px #000)}
#bPrev{left:calc(var(--gl) - 12px)}
#bNext{right:calc(var(--gr) - 12px)}
@media (pointer:coarse){.edge{display:none}}

#stage.scrub #vinfo{opacity:0}
#vinfo{position:absolute;z-index:4;transition:opacity .15s;right:var(--gr);bottom:calc(var(--railh) + var(--gb) + 12px);text-align:right;display:grid;gap:5px;font:500 12px/1.3 var(--ui);text-shadow:0 1px 6px rgba(0,0,0,.8)}
#vname{font-weight:700}
#vtime{font-variant-numeric:tabular-nums;opacity:.86}
#vinfo a{opacity:.86;text-underline-offset:3px}

/* the release calendar: one column per day, one bulb per film */
#rail{position:absolute;z-index:4;left:var(--gl);right:var(--gr);bottom:var(--gb);height:var(--railh);touch-action:none;cursor:pointer}
.days{position:absolute;left:0;right:0;top:0;bottom:15px;display:flex;align-items:stretch;border-bottom:1px solid rgba(255,245,220,.3)}
.day{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;padding-bottom:3px}
.day i{flex:none;width:5px;height:5px;border-radius:50%}
.day.lit i{background:var(--bulb);box-shadow:0 0 7px rgba(255,201,58,.75)}
.day.unlit i{box-shadow:inset 0 0 0 1.2px var(--silver)}
.day i.cur{background:var(--light);box-shadow:0 0 0 2.5px rgba(255,245,220,.32),0 0 12px rgba(255,255,255,.9);transform:scale(1.4)}
.day b{font:700 8.5px/1 var(--ui);opacity:.8;font-variant-numeric:tabular-nums}
.day.today::after{content:"";position:absolute;left:50%;top:-4px;bottom:0;width:1px;margin-left:-.5px;background:rgba(255,245,220,.55);z-index:-1}
.days.intro .day.lit i{animation:lightup .5s both;animation-delay:calc(var(--k) * 14ms)}
@keyframes lightup{from{background:transparent;box-shadow:inset 0 0 0 1.2px var(--silver)}}
.axis{position:absolute;left:0;right:0;bottom:0;height:11px}
.axis span{position:absolute;bottom:0;transform:translateX(-50%);font:500 9.5px/1 var(--ui);opacity:.64;font-variant-numeric:tabular-nums;white-space:nowrap}
.axis .now{opacity:1;font-weight:700}
.day.sel{background:linear-gradient(to top,rgba(255,245,220,.22),rgba(255,245,220,0));border-radius:3px 3px 0 0}
/* while scrubbing, the date floats well above the finger and a stem points down to the day */
.bubble{position:absolute;bottom:calc(100% + 34px);transform:translateX(-50%);max-width:min(78vw,340px);background:var(--light);color:var(--curtain-deep);padding:8px 12px 9px;border-radius:10px;
  pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.5);display:grid;gap:3px;--tx:50%}
.bubble b{font:700 13.5px/1.2 var(--ui);white-space:nowrap}
.bubble span{font:700 11.5px/1.3 var(--ui);opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble::before{content:"";position:absolute;top:100%;left:var(--tx);width:1.5px;height:34px;margin-left:-.75px;background:linear-gradient(var(--light),rgba(255,245,220,.25))}
.bubble::after{content:"";position:absolute;top:calc(100% - 1px);left:var(--tx);margin-left:-7px;border:7px solid transparent;border-top-color:var(--light)}

#seekfx{position:absolute;z-index:3;top:var(--mid);width:96px;height:96px;margin-top:-48px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;font:700 12.5px/1 var(--ui);opacity:0;pointer-events:none}
#seekfx.l{left:12%}
#seekfx.r{right:12%}
#seekfx.c{left:50%;margin-left:-48px}
#seekfx.on{animation:seek .6s}
@keyframes seek{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:none}100%{opacity:0}}

#direct{position:absolute;z-index:7;left:50%;top:calc(var(--gt) + 52px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;white-space:nowrap;
  background:var(--bulb);color:var(--curtain-deep);font:700 13px/1.4 var(--ui);padding:7px 7px 7px 16px;border-radius:99px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#direct button{font:700 12px/1 var(--ui);padding:9px 12px;border-radius:99px;background:rgba(42,7,16,.14)}

#scrimS{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .25s}
#stage.sheet #scrimS{opacity:1;pointer-events:auto}
/* the sheet is the same smoked glass as the rest of the overlay UI */
#sheet{position:absolute;z-index:6;top:0;bottom:0;right:0;width:min(56%,500px);display:flex;flex-direction:column;transform:translateX(104%);transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .22s;
  background:rgba(12,10,12,.68);-webkit-backdrop-filter:blur(28px) saturate(1.3);backdrop-filter:blur(28px) saturate(1.3);box-shadow:inset 1px 0 0 rgba(255,245,220,.1)}
#stage.sheet #sheet{transform:none}
#bClose{position:absolute;z-index:1;top:calc(var(--gt) + 2px);right:calc(var(--gr) - 8px)}
#sheetBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:none;padding:calc(var(--gt) + 14px) var(--gr) calc(var(--gb) + 16px) 22px;display:flex;flex-direction:column;gap:14px}
#sheetBody>*{flex:none}
.ihead{display:flex;gap:14px;align-items:flex-start;padding-right:38px}
.poster{flex:none;width:76px;aspect-ratio:2/3;border-radius:4px;object-fit:cover;background:rgba(0,0,0,.3)}
.idate{margin:0 0 4px;font:700 12px/1.4 var(--ui);color:var(--bulb)}
.ihead h3{margin:0;font:800 21px/1.3 var(--display);text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.iorig,.isub{margin:3px 0 0;font:500 12px/1.5 var(--ui);opacity:.76}
.overview{margin:0;font:500 13.5px/1.85 var(--ui)}
.ovnote{margin:-6px 0 0;font:500 11.5px/1.6 var(--ui);opacity:.6}
.credits{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font:500 12.5px/1.6 var(--ui)}
.credits dt{opacity:.66}
.credits dd{margin:0}
#sheetBody h3.sh{margin:0;padding-right:38px;font:800 21px/1.3 var(--display)}
#sheetBody h4{margin:4px 0 -6px;font:700 12px/1.4 var(--ui);opacity:.7}
.vids{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.vids button{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:rgba(255,245,220,.07);font:500 12.5px/1.45 var(--ui)}
.vids button[aria-current="true"]{box-shadow:inset 0 0 0 1.5px var(--bulb)}
.vids button span{flex:none;opacity:.66}
.links{margin:0;display:flex;gap:18px;font:700 12.5px/1.4 var(--ui)}
.links a{text-underline-offset:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:48px;padding:7px 0;border-bottom:1px solid rgba(255,245,220,.13);font:500 13.5px/1.45 var(--ui)}
.row small{display:block;font-size:11.5px;opacity:.66}
.btn{flex:none;font:700 12.5px/1 var(--ui);padding:10px 14px;border-radius:99px;box-shadow:inset 0 0 0 1.2px rgba(255,245,220,.5)}
.btn:active{background:rgba(255,245,220,.14)}
.sw{-webkit-appearance:none;appearance:none;flex:none;width:44px;height:26px;margin:0;border-radius:99px;background:rgba(255,245,220,.22);position:relative;transition:background .15s;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--light);transition:transform .15s}
.sw:checked{background:var(--bulb)}
.sw:checked::after{transform:translateX(18px);background:var(--curtain-deep)}
.credit{margin:0;font:500 11px/1.75 var(--ui);opacity:.62}

#veil{position:absolute;inset:0;z-index:8;display:grid;align-content:center;padding:0 var(--gr) 0 calc(var(--gl) + 5%)}
.vin{display:grid;gap:12px;max-width:34rem}
.vbrand{margin:0 0 4px;font:800 clamp(38px,calc(var(--H) * .17),80px)/1 var(--display)}
#vmsg{margin:0;font:800 18px/1.45 var(--display)}
#vsub{margin:0;font:500 12.5px/1.7 var(--ui);opacity:.78;font-variant-numeric:tabular-nums}
.vbar{height:3px;max-width:22rem;border-radius:2px;overflow:hidden;background:rgba(255,245,220,.2)}
.vbar i{display:block;height:100%;width:0;background:var(--bulb);transition:width .2s}
#vact{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
#veil[data-mode="load"] #vact,#veil:not([data-mode="load"]) .vbar{display:none}

#toast{position:absolute;z-index:9;left:50%;top:calc(var(--gt) + 52px);transform:translate(-50%,-8px);max-width:78%;text-align:center;background:rgba(0,0,0,.8);font:500 12.5px/1.55 var(--ui);padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}


/* ---------- portrait layout: video band on top, the film below it ---------- */
#stage.tall{--railh:70px;--vt:calc(var(--gt) + 88px);--vh:calc(var(--W) * 9 / 16);--vb:calc(var(--vt) + var(--vh));--mid:calc(var(--vt) + var(--vh) / 2)}
#stage.tall:not(.hud) .h{opacity:1;pointer-events:auto}
#stage.tall #top{height:auto;flex-wrap:wrap;row-gap:4px;padding-bottom:0}
#stage.tall .chips{order:3;width:100%}
#stage.tall #ambient{display:none}
#stage.tall #ytbox{left:0;top:var(--vt);transform:none}
#stage.tall .slide .bg{top:var(--vt);height:var(--vh);bottom:auto}
#stage.tall .slide .scrim{display:none}
#stage.tall .slide .ambw{display:block;position:absolute;left:0;right:0;top:var(--vb);bottom:0;overflow:hidden}
#stage.tall .slide .amb{position:absolute;inset:-25%;background:#000 center/cover no-repeat;filter:blur(30px) brightness(.34) saturate(1.2)}
#stage.tall .meta{top:calc(var(--vb) + 18px);bottom:calc(var(--railh) + var(--gb) + 40px);right:var(--gr);max-width:none;gap:8px;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}
#stage.tall .meta>*{flex-shrink:0}   /* a long synopsis is cut off by the mask; the title never gives way */
#stage.tall .when{max-width:none}

/* portrait details: the area under the video simply becomes scrollable. The panel fades in exactly over the film's
   date, title and synopsis (same type, same place) on the same blurred backdrop, and the rest follows below. */

#stage.tall.inl #sheetBody{padding:18px var(--gr) calc(var(--gb) + 28px) var(--gl);
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 16px);mask-image:linear-gradient(to bottom,transparent,#000 16px)}
#stage.tall.inl #bClose{top:8px}
#stage.tall .slide .meta,#stage.tall #vinfo,#stage.tall #rail{transition:opacity .22s}

.imeta{display:flex;flex-direction:column;gap:8px}
.imeta .when{padding-right:40px}
.imeta .title{display:block;overflow:visible}
#stage.tall.inl .overview{font:500 13px/1.85 var(--ui);opacity:.84;margin-top:6px}
#stage.tall.sheet #sheet{transform:none}

#stage.tall #toast,#stage.tall #direct{top:calc(var(--vt) + 14px)}

/* ---------- landscape details: the video moves left and the details sit beside it ---------- */
#stage{--pw:min(42%,460px)}
#stage.split #scrimS{background:none;pointer-events:none}
#stage.split #sheet{width:var(--pw)}
#stage.split #player,#stage.split #track{right:var(--pw)}
#stage.split .slide .meta{opacity:0;pointer-events:none}
#stage.split #rail,#stage.split #vinfo{right:calc(var(--pw) + var(--gr))}
#stage.split #bNext{right:calc(var(--pw) + var(--gr) - 12px)}
.dbtn{justify-self:end;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px 0 10px;border-radius:99px;font:700 12.5px/1 var(--ui);
  background:rgba(12,10,12,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,245,220,.28);text-shadow:none}
.dbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dbtn[aria-pressed="true"]{background:var(--light);color:var(--curtain-deep);box-shadow:none}
#stage.tall .dbtn{display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const TMDB = 'https://api.themoviedb.org/3';
const IMG = 'https://image.tmdb.org/t/p/';
const REGION = 'JP', LANG = 'ja-JP';
const HOT_N = 20, MAXDOT = 5;
const NS = 'trailadder.';
const DOW = ['日', '月', '火', '水', '木', '金', '土'];
const TYPE_JA = { Trailer: '予告編', Teaser: '特報', Clip: '本編映像', Featurette: '特別映像', 'Behind the Scenes': 'メイキング', Bloopers: 'NG集', 'Opening Credits': 'オープニング' };
const TYPE_RANK = { Trailer: 0, Teaser: 1, Clip: 2, Featurette: 3 };
const LANG_JA = { en: '英語', ko: '韓国語', zh: '中国語', cn: '広東語', fr: 'フランス語', es: 'スペイン語', de: 'ドイツ語', it: 'イタリア語', hi: 'ヒンディー語', th: 'タイ語' };

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const todayS = () => iso(new Date());
const dayDiff = (a, b) => Math.round((a - b) / 864e5);
const addMonths = (d, n) => { const r = new Date(d.getFullYear(), d.getMonth() + n, d.getDate()); if (r.getDate() !== d.getDate()) r.setDate(0); return r; };
const fmtTime = s => { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(NS + k); } catch (e) {} }
};

// Touch taps are read from pointer events, not from click: Chrome drops the click of a tap that lands
// just after a flick, and a control should answer the moment the finger lifts.
let ghost = null;
document.addEventListener('click', e => {
  // swallow the click that follows a tap already handled, so it cannot land on whatever appeared underneath
  if (ghost && e.timeStamp - ghost.t < 600 && Math.hypot(e.clientX - ghost.x, e.clientY - ghost.y) < 40) { ghost = null; e.preventDefault(); e.stopPropagation(); }
}, true);
const markTap = e => { ghost = { t: e.timeStamp, x: e.clientX, y: e.clientY }; };
function onTap(el, fn) {
  let pid = null, x = 0, y = 0, t = 0;
  el.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; pid = e.pointerId; x = e.clientX; y = e.clientY; t = e.timeStamp; });
  el.addEventListener('pointerup', e => {
    if (e.pointerId !== pid) return;
    pid = null;
    if (Math.hypot(e.clientX - x, e.clientY - y) > 14 || e.timeStamp - t > 700) return;
    markTap(e); fn(e);
  });
  el.addEventListener('pointercancel', () => { pid = null; });
  el.addEventListener('click', fn);   // mouse and keyboard
}

/* ---------- elements & state ---------- */
const stage = $('#stage'), track = $('#track'), player = $('#player'), ytbox = $('#ytbox'), ambient = $('#ambient');
const gest = $('#gest'), rail = $('#rail'), daysEl = $('#days'), axisEl = $('#axis'), bubble = $('#bubble');
const sheet = $('#sheet'), sheetBody = $('#sheetBody');
const slides = [...document.querySelectorAll('.slide')];
const roles = { prev: slides[0], cur: slides[1], next: slides[2] };

const prefs = Object.assign({ mode: 'portrait', flip: false, fill: false, autoNext: true }, store.get('prefs', {}));
const savePrefs = () => store.set('prefs', prefs);
let data = null;          // { from, to, today, fetchedAt, films, skipped }
let view = [];            // films after the active filter, in release order
let idx = 0;
let filter = 'all';
let rot = 0, W = 0, H = 0, VW = 0, VH = 0;
let hudOn = true, hudT = 0, sheetOpen = null, scrubbing = false, direct = null;
let animating = false, pendingDir = 0, animT = 0, loadT = 0, loadPending = false;
let railN = 0, railDays = [], byDay = new Map();

/* ---------- layout: the stage is landscape whatever the device says ---------- */
const coarse = matchMedia('(pointer:coarse)').matches;
function layout() {
  VW = window.innerWidth; VH = window.innerHeight;
  const portrait = coarse && VH > VW;
  rot = portrait && prefs.mode === 'landscape' ? (prefs.flip ? -90 : 90) : 0;
  W = rot ? VH : VW; H = rot ? VW : VH;
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  stage.style.transform = rot === 90 ? `translate(${VW}px,0) rotate(90deg)` : rot === -90 ? `translate(0,${VH}px) rotate(-90deg)` : 'none';
  stage.classList.toggle('cw', rot === 90);
  stage.classList.toggle('ccw', rot === -90);
  stage.classList.toggle('narrow', W < 760);
  stage.classList.toggle('tall', !rot && H > W);
  if (sheetOpen === 'info' && stage.classList.contains('tall') === stage.classList.contains('split')) openSheet('info');   // turned the phone: switch between in-place and side-by-side
  const bo = $('#bOrient');
  bo.hidden = !coarse;
  bo.setAttribute('aria-label', prefs.mode === 'landscape' ? '縦画面にする' : '横画面にする');
  stage.style.setProperty('--W', W + 'px');
  stage.style.setProperty('--H', H + 'px');
  sizePlayer();
  if (data && view.length) { buildRail(); markRail(); }
}
// read the shared link before anything rewrites the address bar
let sharedLink = (() => { const q = new URLSearchParams(location.search), id = +q.get('f'); return id ? { id, v: q.get('v') } : null; })();
let SW = 0;   // width of the film strip: the whole stage, or the part left of the details column
function sizePlayer() {
  const split = stage.classList.contains('split');
  SW = split ? W - Math.min(W * .42, 460) : W;
  if (stage.classList.contains('tall')) { ytbox.style.width = W + 'px'; ytbox.style.height = (W * 9 / 16) + 'px'; return; }
  const pw = prefs.fill && !split ? Math.max(W, H * 16 / 9) : Math.min(SW, H * 16 / 9);
  ytbox.style.width = pw + 'px'; ytbox.style.height = (pw * 9 / 16) + 'px';
  stage.classList.toggle('fill', !!prefs.fill);
}
// screen point -> stage point
function toUI(x, y) { return rot === 90 ? { x: y, y: VW - x } : rot === -90 ? { x: VH - y, y: x } : { x, y }; }
function uiRect(el) {
  const r = el.getBoundingClientRect();
  if (rot === 90) return { left: r.top, top: VW - r.right, width: r.height, height: r.width };
  if (rot === -90) return { left: VH - r.bottom, top: r.left, width: r.height, height: r.width };
  return { left: r.left, top: r.top, width: r.width, height: r.height };
}

/* ---------- film text ---------- */
function stateOf(date) {
  const d = dayDiff(parseISO(date), startOfDay(new Date()));
  if (d > 1) return { lit: false, text: `公開まであと${d}日` };
  if (d === 1) return { lit: false, text: 'あした公開' };
  if (d === 0) return { lit: true, text: 'きょう公開' };
  return { lit: true, text: `公開${1 - d}日目` };
}
const GENRE_SHORT = { サイエンスフィクション: 'SF', アニメーション: 'アニメ', 履歴: '歴史' };   // cinemaladder と同じ短縮
function subOf(f) {
  const a = [];
  if (f.runtime) a.push(f.runtime + '分');
  if (f.genres.length) a.push(f.genres.slice(0, 2).map(g => GENRE_SHORT[g] || g).join('／'));
  if (f.cert) a.push(f.cert);
  if (f.revival) a.push('リバイバル上映');
  return a.join('　');
}
const bgUrl = f => f.backdrop ? IMG + 'w1280' + f.backdrop : f.poster ? IMG + 'w780' + f.poster : `https://i.ytimg.com/vi/${f.vids[0].key}/hqdefault.jpg`;
const curVid = f => f.vids[f.vi || 0];
function vidLabel(v) {
  let s = TYPE_JA[v.type] || '映像';
  if (v.lang && v.lang !== 'ja') s += `（${LANG_JA[v.lang] || '原語'}）`;
  return s;
}

/* ---------- slides ---------- */
function paint(el, f) {
  el.classList.remove('live');
  if (!f) { el.hidden = true; return; }
  el.hidden = false;
  const d = parseISO(f.date), st = stateOf(f.date);
  $('.bg', el).style.backgroundImage = `url("${bgUrl(f)}")`;
  $('.date', el).textContent = `${d.getMonth() + 1}.${d.getDate()}`;
  $('.dow', el).textContent = DOW[d.getDay()];
  const s = $('.state', el); s.textContent = st.text; s.className = 'state ' + (st.lit ? 'lit' : 'unlit');
  $('.title', el).textContent = f.title;
  $('.sub', el).textContent = subOf(f);
  $('.ov', el).textContent = f.overview || '';
  $('.amb', el).style.backgroundImage = `url("${f.backdrop ? IMG + 'w300' + f.backdrop : bgUrl(f)}")`;
}
const at = i => { const n = view.length; return n ? view[((i % n) + n) % n] : null; };
const side = i => view.length > 1 ? at(i) : null;
function setRoles() { for (const k in roles) roles[k].dataset.role = k; }
function renderAll() { paint(roles.prev, side(idx - 1)); paint(roles.cur, view[idx]); paint(roles.next, side(idx + 1)); setRoles(); }
function setX(x, animate) {
  const t = animate ? 'transform 260ms cubic-bezier(.2,.8,.2,1)' : 'none';
  const tr = `translate3d(${x}px,0,0)`;
  track.style.transition = t; player.style.transition = t;
  track.style.transform = tr; player.style.transform = tr;
}
function go(dir) {
  if (animating) finalize();
  if (view.length < 2) { bump(dir); return; }
  animating = true; pendingDir = dir;
  setX(-dir * (SW || W), true);
  animT = setTimeout(finalize, 290);
}
function finalize() {
  if (!animating) return;
  clearTimeout(animT); animating = false;
  const dir = pendingDir, n = view.length; pendingDir = 0;
  const raw = idx + dir; idx = ((raw % n) + n) % n;
  if (raw >= n) toast('最初の作品に戻りました', 1600); else if (raw < 0) toast('最後の作品に移りました', 1600);
  if (dir > 0) { const old = roles.prev; roles.prev = roles.cur; roles.cur = roles.next; roles.next = old; paint(old, side(idx + 1)); }
  else { const old = roles.next; roles.next = roles.cur; roles.cur = roles.prev; roles.prev = old; paint(old, side(idx - 1)); }
  roles.prev.classList.remove('live'); roles.next.classList.remove('live');
  setRoles(); setX(0, false); onSettle();
}
function bump(dir) {
  setX(-dir * 36, true);
  setTimeout(() => { if (!animating) setX(0, true); }, 170);
}
function jumpTo(i) {
  if (animating) finalize();
  idx = clamp(i, 0, view.length - 1);
  renderAll(); setX(0, false); onSettle();
}
function onSettle() {
  const f = view[idx]; if (!f) return;
  ambient.style.backgroundImage = `url("${f.backdrop ? IMG + 'w300' + f.backdrop : bgUrl(f)}")`;
  if (view.length > 1) for (const n of [idx + 1, idx + 2, idx - 1]) new Image().src = bgUrl(at(n));
  markRail(); updateVinfo();
  if (sheetOpen === 'info') { sheetBody.innerHTML = infoHTML(f); sheetBody.scrollTop = 0; sheetBody.style.transition = 'none'; sheetBody.style.transform = ''; }
  try { history.replaceState(null, '', shareUrl(f)); } catch (e) {}   // the address bar is always this film's link
  document.title = `${f.title}｜予告編 - trailadder`;   // the server titles the page after the film in the link; follow the film on screen
  setHud(true); queueLoad();
}
function queueLoad() {
  clearTimeout(loadT);
  stage.classList.remove('stalled', 'playing', 'buffering', 'loading');
  $('#progress i').style.width = '0'; $('#vtime').textContent = '';
  if (P.ready) { try { P.yt.pauseVideo(); } catch (e) {} }
  const f = view[idx]; if (!f || f.blocked) { loadPending = false; return; }
  loadPending = true; stage.classList.add('loading');
  loadT = setTimeout(() => { loadPending = false; P.load(curVid(f).key); }, P.yt ? 180 : 0);
}
function updateVinfo() {
  const f = view[idx]; if (!f) return;
  const v = curVid(f), url = 'https://www.youtube.com/watch?v=' + v.key;

  <h3 class="sh">設定</h3>
  <label class="row" for="optAuto"><span>終わったら次の予告へ進む</span><input class="sw" type="checkbox" id="optAuto"${prefs.autoNext ? ' checked' : ''}></label>
  <label class="row" for="optFill"><span>映像を画面いっぱいに拡大する<small>上下が少し切れます。ピンチでも切り替えられます</small></span><input class="sw" type="checkbox" id="optFill"${prefs.fill ? ' checked' : ''}></label>
  ${coarse ? `<div class="row"><span>画面の向き<small>横画面は、本体の画面の回転ロックをオンにしてお使いください</small></span><button class="btn" type="button" data-act="mode">${prefs.mode === 'landscape' ? '縦画面にする' : '横画面にする'}</button></div>` : ''}
  ${coarse && prefs.mode === 'landscape' ? `<div class="row"><span>横画面で倒す向き<small>本体をどちらに倒して観るかを入れ替えます</small></span><button class="btn" type="button" data-act="flip">反対向きにする</button></div>` : ''}
  <div class="row"><span>作品データ<small>${data.films.length}本・${t.getMonth() + 1}月${t.getDate()}日 ${t.getHours()}:${pad(t.getMinutes())} 更新（毎朝自動で更新）</small></span><button class="btn" type="button" data-act="reload">読み込み直す</button></div>
  <div class="row"><span>音が出ないとき<small>映像を一度だけ直接タップして再生します</small></span><button class="btn" type="button" data-act="unlock">直接タップに切り替える</button></div>
  <p class="credit">作品情報と画像は TMDB から取得しています。This product uses the TMDB API but is not endorsed or certified by TMDB. 映像は YouTube の埋め込みプレイヤーで再生しています。</p>`;
}
let inlT = 0;
function openSheet(kind) {
  if (!view.length) return;
  sheetOpen = kind;
  const tall = stage.classList.contains('tall');
  clearTimeout(inlT); stage.classList.toggle('inl', kind === 'info' && tall);
  const split = kind === 'info' && !tall;
  if (split !== stage.classList.contains('split')) { stage.classList.toggle('split', split); sizePlayer(); }
  $('#bDetail').setAttribute('aria-pressed', String(split));
  sheetBody.innerHTML = kind === 'info' ? infoHTML(view[idx]) : settingsHTML();
  sheetBody.scrollTop = 0;
  stage.classList.add('sheet'); sheet.setAttribute('aria-hidden', 'false'); setHud(true);
}
function closeSheet() {
  if (!sheetOpen) return;
  sheetOpen = null; stage.classList.remove('sheet'); sheet.setAttribute('aria-hidden', 'true'); setHud(true);
  clearTimeout(inlT); inlT = setTimeout(() => { if (!sheetOpen) stage.classList.remove('inl'); }, 260);   // after the fade
  if (stage.classList.contains('split')) { stage.classList.remove('split'); sizePlayer(); }
  $('#bDetail').setAttribute('aria-pressed', 'false');
}
function sheetAct(target, viaTouch) {
  const b = target.closest('[data-vi],[data-act]');
  if (!b) {
    // a touch tap on a switch row flips the switch itself; mouse and keyboard go through the label natively
    const row = viaTouch && target.closest('label.row'), sw = row && row.querySelector('input.sw');
    if (!sw) return false;
    sw.checked = !sw.checked; sw.dispatchEvent(new Event('change', { bubbles: true }));
    return true;
  }
  if (b.dataset.vi != null) {
    const f = view[idx]; f.vi = +b.dataset.vi; f.blocked = false; f.tries = 0;
    closeSheet(); updateVinfo(); roles.cur.classList.remove('live'); queueLoad();
    return true;
  }
  const act = b.dataset.act;
  if (act === 'mode') { closeSheet(); setMode(prefs.mode === 'landscape' ? 'portrait' : 'landscape'); }
  else if (act === 'flip') { prefs.flip = !prefs.flip; savePrefs(); layout(); if (!rot) toast('縦向きで開いたときに反映されます'); }
  else if (act === 'reload') { closeSheet(); start(true); }
  else if (act === 'unlock') {
    closeSheet();
    if (!P.ready) { toast('プレイヤーを準備しています'); return true; }
    P.muted = false; P.yt.unMute(); P.yt.setVolume(100); P.yt.pauseVideo(); syncSound(); enterDirect('sound');
  }
  return true;
}
sheetBody.addEventListener('click', e => { sheetAct(e.target, false); });
sheetBody.addEventListener('change', e => {
  if (e.target.id === 'optAuto') { prefs.autoNext = e.target.checked; savePrefs(); }
  if (e.target.id === 'optFill') setFill(e.target.checked);
});
// native scrolling follows the screen, not the rotated stage, so touch scrolling is done by hand
let flingRaf = 0;
function fling(vy) {
  cancelAnimationFrame(flingRaf);
  let v = clamp(vy, -3, 3) * 16;
  const step = () => { if (Math.abs(v) < .4) return; sheetBody.scrollTop -= v; v *= .94; flingRaf = requestAnimationFrame(step); };
  step();
}
(() => {
  let id = null, x0 = 0, y0 = 0, s0 = 0, t0 = 0, ly = 0, lt = 0, vy = 0, moved = false, dir = null, hs = [];
  sheetBody.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    const p = toUI(e.clientX, e.clientY);
    id = e.pointerId; x0 = p.x; y0 = ly = p.y; t0 = lt = e.timeStamp; s0 = sheetBody.scrollTop; vy = 0; moved = false; dir = null; hs = [{ x: p.x, t: e.timeStamp }];
    cancelAnimationFrame(flingRaf);
  });
  sheetBody.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const p = toUI(e.clientX, e.clientY), dx = p.x - x0, dy = p.y - y0;
    if (Math.abs(dy) > 6 || Math.abs(dx) > 6) moved = true;
    if (!dir) { if (Math.hypot(dx, dy) < 10) return; dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v'; }
    if (dir === 'h') {
      if (stage.classList.contains('inl')) {
        // portrait details: a sideways swipe changes the film, details and all
        const x = view.length < 2 ? dx * .28 : dx;
        setX(x, false); sheetBody.style.transition = 'none'; sheetBody.style.transform = `translate3d(${x}px,0,0)`;
        hs.push({ x: p.x, t: e.timeStamp }); if (hs.length > 5) hs.shift();
      } else if (dx > 70) { id = null; closeSheet(); }
      return;
    }
    sheetBody.scrollTop = s0 - dy;
    const dt = e.timeStamp - lt;
    if (dt > 0) { vy = (p.y - ly) / dt; ly = p.y; lt = e.timeStamp; }
    if (stage.classList.contains('tall') && s0 <= 0 && dy > 90 && Math.abs(dx) < 60) { id = null; closeSheet(); }
  });
  const up = e => {
    if (e.pointerId !== id) return;
    id = null;
    if (!moved) { if (e.type === 'pointerup' && e.timeStamp - t0 < 700 && sheetAct(e.target, true)) markTap(e); return; }
    setTimeout(() => { moved = false; }, 80);
    if (dir === 'h') {
      if (!stage.classList.contains('inl')) return;
      const p = toUI(e.clientX, e.clientY), dx = p.x - x0, a = hs[0], b = hs[hs.length - 1];
      const v = hs.length > 1 ? (b.x - a.x) / Math.max(1, b.t - a.t) : 0;
      const go1 = e.type === 'pointerup' && view.length > 1 && (Math.abs(dx) > W * .2 || (Math.abs(v) > .45 && Math.abs(dx) > 24 && Math.sign(v) === Math.sign(dx)));
      sheetBody.style.transition = 'transform 260ms cubic-bezier(.2,.8,.2,1)';
      if (go1) { const d = dx < 0 ? 1 : -1; sheetBody.style.transform = `translate3d(${-d * W}px,0,0)`; go(d); }
      else { sheetBody.style.transform = ''; setX(0, true); }
      return;
    }
    fling(vy);
  };
  sheetBody.addEventListener('pointerup', up);
  sheetBody.addEventListener('pointercancel', up);
  sheetBody.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
})();

/* ---------- links to one film ---------- */
// ?f=<TMDB id>, plus &v=<YouTube id> when another of its videos is chosen. Films that have left the window
// are looked up in data/archive.json, which keeps every film the site has listed.
function shareUrl(f) {
  const u = new URL(location.pathname, location.origin);
  u.searchParams.set('f', f.id);
  if ((f.vi || 0) > 0) u.searchParams.set('v', curVid(f).key);
  return u.href;
}
async function share() {
  const f = view[idx]; if (!f) return;
  const url = shareUrl(f), d = parseISO(f.date);
  const text = `${f.title}（${d.getMonth() + 1}月${d.getDate()}日公開）の${vidLabel(curVid(f))}`;
  if (navigator.share) {
    try { await navigator.share({ title: f.title, text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast('この予告編へのリンクをコピーしました'); }
  catch (e) { toast(url, 8000); }
}
async function openShared(id, vkey) {
  const pick = f => { if (vkey) { const k = f.vids.findIndex(v => v.key === vkey); if (k >= 0) f.vi = k; } };
  const i = view.findIndex(f => f.id === id);
  if (i >= 0) { pick(view[i]); jumpTo(i); return; }
  let a = null;
  try { const r = await fetch('data/archive.json', { cache: 'no-cache' }); if (r.ok) a = (await r.json())[id]; } catch (e) {}
  if (!a || !a.v || !a.v.length) { toast('共有された作品は見つかりませんでした。今日の作品から始めます', 4000); return; }
  const g = { id, title: a.t, otitle: a.o || '', date: a.d, vids: a.v, genres: a.g || [], gids: [], runtime: a.r || 0, poster: a.p || null, backdrop: a.b || null,
    director: [], cast: [], overview: '', ol: '', pop: 0, archived: true, vi: 0, blocked: false, tries: 0 };
  pick(g);
  view.unshift(g); buildRail(); jumpTo(0);
  toast('掲載期間を過ぎた作品です。左右にスワイプすると今の作品に移ります', 5000);
}

/* ---------- buttons ---------- */
$('#bShare').addEventListener('click', share);   // a plain click, so the share sheet counts as a user action
onTap($('#bDetail'), () => { sheetOpen === 'info' ? closeSheet() : openSheet('info'); });
onTap($('#bSound'), toggleSound);
onTap($('#bFill'), () => { setFill(!prefs.fill); setHud(true); });
onTap($('#bInfo'), () => openSheet('info'));
onTap($('#bOrient'), () => setMode(prefs.mode === 'landscape' ? 'portrait' : 'landscape'));
onTap($('#bSet'), () => openSheet('settings'));
onTap($('#bPrev'), () => go(-1));
onTap($('#bNext'), () => go(1));
onTap($('#bClose'), closeSheet);
onTap($('#scrimS'), closeSheet);
onTap($('#bDirectOff'), () => exitDirect(true));
onTap($('#chips'), e => { const b = e.target.closest('[data-f]'); if (b && b.dataset.f !== filter) setFilter(b.dataset.f); else setHud(true); });
onTap($('#bRetry'), () => start(true));

/* ---------- loading and errors ---------- */
function veil(mode, info) {
  const v = $('#veil');
  if (!mode) { v.hidden = true; return; }
  v.hidden = false; v.dataset.mode = mode;
  const msg = $('#vmsg'), sub = $('#vsub');
  if (mode === 'load') { msg.textContent = '予告編を読み込んでいます'; sub.textContent = ''; $('#vbar').style.width = '40%'; }
  else if (mode === 'empty') { msg.textContent = 'この期間に、予告編のある作品が見つかりませんでした'; sub.textContent = '作品データは毎朝更新されます。時間をおいて、もう一度読み込んでください。'; }
  else { msg.textContent = '作品データを読み込めませんでした'; sub.textContent = info && info.status === 404 ? '作品データがまだ作られていません。GitHub の Actions で「Update films」を実行してください。' : info && info.status ? `エラー ${info.status} が返りました。少し待ってから読み込み直してください。` : '通信状況を確認して、読み込み直してください。'; }
}
async function start(force) {
  stage.hidden = false; layout();
  if (!data) veil('load');
  try {
    const r = await fetch('data/films.json', { cache: force ? 'reload' : 'no-cache' });
    if (!r.ok) { const e = new Error('films ' + r.status); e.status = r.status; throw e; }
    const d = await r.json();
    // the file is built each morning; keep today's window exactly
    const t = startOfDay(new Date()), from = iso(addMonths(t, -1)), to = iso(addMonths(t, 2));
    d.from = from; d.to = to; d.films = (d.films || []).filter(f => f.date >= from && f.date <= to);
    data = d;
  } catch (e) {
    if (data) { toast('作品データを読み込み直せませんでした', 3000); return; }
    veil('error', e); return;
  }
  if (!data.films.length) { veil('empty'); return; }
  ready();
}
function ready() {
  veil(null);
  for (const f of data.films) { f.vi = 0; f.blocked = false; f.tries = 0; }
  syncSound();
  const link = sharedLink; sharedLink = null;   // only the first start follows the link; later reloads keep the current film
  setFilter('all', true);
  if (link) openShared(link.id, link.v);
  daysEl.classList.add('intro'); setTimeout(() => daysEl.classList.remove('intro'), 1800);
  if (!store.get('hinted', false)) {
    store.set('hinted', true);
    setTimeout(() => toast(stage.classList.contains('tall') ? '左右にスワイプで作品を切り替え。あらすじを上になぞると詳細が続きます' : '左右にスワイプで作品を切り替え。右下の「詳細」で作品情報を横に並べます', 5200), 900);
  }
}

addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 80));
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
layout();
start(false);
})();
</script>
